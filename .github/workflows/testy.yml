# GitHub Actions: po kazdym "git push" GitHub sam instaluje biblioteki
# i uruchamia testy. Zielony znaczek = kod dziala.
name: testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja bibliotek
        run: pip install -r requirements.txt
      - name: Testy
        run: pytest -v
